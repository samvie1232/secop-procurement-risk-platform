version: 2

models:
  - name: risk_fraccionamiento
    description: >
      Parejas entidad-proveedor con varios contratos directos en pocos días
      (ventana y mínimo en las vars fraccionamiento_*).
    data_tests:
      - unique:
          arguments:
            column_name: "codigo_entidad || '|' || codigo_proveedor"
    columns:
      - name: max_contratos_ventana
        data_tests:
          - rango:
              arguments:
                min: "{{ var('fraccionamiento_min_contratos') }}"

  - name: risk_entidad
    description: >
      Indicadores por entidad en los últimos dias_analisis días: % de
      contratación directa, concentración de proveedores (HHI) y proveedores
      con señal de fraccionamiento, más un puntaje compuesto de 0 a 100
      (40 % directa, 40 % HHI, 20 % fraccionamiento, en percentiles).
    columns:
      - name: codigo_entidad
        data_tests: [unique, not_null]
      - name: pct_directa_valor
        data_tests:
          - rango:
              arguments: {min: 0, max: 1}
      - name: hhi
        data_tests:
          - rango:
              arguments: {min: 0, max: 10000.001}
      - name: puntaje_riesgo
        data_tests:
          - rango:
              arguments: {min: 0, max: 100}

  - name: risk_proveedor
    description: >
      Indicadores por proveedor en los últimos dias_analisis días: proveedor
      nuevo con contratos grandes, entidades con señal de fraccionamiento y %
      de contratación directa, más un puntaje compuesto de 0 a 100 (50 %, 30 %
      y 20 %).
    columns:
      - name: codigo_proveedor
        data_tests: [unique, not_null]
      - name: puntaje_riesgo
        data_tests:
          - rango:
              arguments: {min: 0, max: 100}

  - name: risk_contrato_candidato
    description: >
      Contratos del periodo de análisis que ya marca al menos uno de los otros
      indicadores (fraccionamiento, proveedor nuevo con contratos grandes o
      contrato directo de una entidad con puntaje alto). Son los únicos que
      lee la señal de texto; prioridad = cuántos motivos tiene.
    columns:
      - name: id_contrato
        data_tests: [unique, not_null]
      - name: prioridad
        data_tests:
          - rango:
              arguments: {min: 1, max: 3}

  - name: risk_senal_texto
    description: >
      Quinto indicador: lectura del objeto, la descripción y la justificación
      del contrato con Claude (Amazon Bedrock). Una fila por contrato leído.
      bandera = nivel medio o alto con una cita que está en el contrato. Es
      una señal de riesgo para revisión humana, no prueba de irregularidad.
    columns:
      - name: id_contrato
        data_tests: [unique, not_null]
      - name: nivel
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ninguno, bajo, medio, alto]
      - name: bandera
        data_tests: [not_null]
