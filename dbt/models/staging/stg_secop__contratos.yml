version: 2

models:
  - name: stg_secop__contratos
    description: >
      Contratos de raw con tipos y nombres estándar. Mismo grano que raw: un
      contrato aparece una vez por cada extracción que lo trajo.
    columns:
      - name: id_contrato
        description: Llave del contrato en SECOP II (ej. CO1.PCCNTR.6861643).
      - name: es_contratacion_directa
        description: Verdadero si la modalidad es alguna forma de contratación directa.
      - name: nit_entidad
        description: NIT sin puntos ni dígito de verificación.
      - name: documento_proveedor
        description: Documento sin puntos ni dígito de verificación.
      - name: fecha_carga
        description: Partición de raw de la que viene la fila.

  - name: stg_secop__senales_texto
    description: >
      Lecturas de la señal de texto (Claude en Amazon Bedrock) sobre los
      contratos candidatos. Una fila por contrato y por corrida.
    columns:
      - name: nivel
        data_tests:
          - accepted_values:
              arguments:
                values: [ninguno, bajo, medio, alto]
