# Conexión de dbt con Athena. No lleva llaves: usa las credenciales de AWS del
# perfil activo (AWS_PROFILE=secop en tu terminal, secop-airflow en Airflow).
secop:
  target: dev
  outputs:
    dev:
      type: athena
      region_name: us-east-2
      database: awsdatacatalog          # el catálogo de Glue
      schema: secop_analytics           # base de Glue donde quedan los modelos
      work_group: secop                 # hereda el límite de 5 GB por consulta
      s3_staging_dir: s3://secop-risk-athena-results-716528269015/
      s3_data_dir: s3://secop-risk-lake-716528269015/dbt/
      s3_data_naming: schema_table_unique
      threads: 4
      num_retries: 2
